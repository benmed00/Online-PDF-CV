<!doctype html>
<html lang="en">
  <head>
    <title>BEN-YAKOUB CV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Online resume in PDF format with multiple versions for different purposes"
    />
    <meta name="keywords" content="resume, CV, PDF, online resume, professional resume" />
    <meta name="author" content="Resume Owner" />
    <meta property="og:title" content="BEN-YAKOUB CV" />
    <meta
      property="og:description"
      content="Online resume in PDF format with multiple versions for different purposes"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://benyakoub-cv.firebaseapp.com/" />
    <meta property="og:image" content="/images/resume-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BEN-YAKOUB CV" />
    <meta
      name="twitter:description"
      content="Online resume in PDF format with multiple versions for different purposes"
    />
    <meta name="twitter:image" content="/images/resume-preview.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/stylesheets/style.css" />
  </head>
  <body class="resume-page">
    <div class="resume-viewport">
      <iframe
        id="resume-frame"
        src="/resume#navpanes=0&amp;toolbar=0&amp;view=FitH"
        title="BEN-YAKOUB CV"
        frameborder="0"
      ></iframe>
      <p class="hidden resume-error" id="resume-error" role="alert">
        Could not load the resume PDF. Please try again later.
      </p>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const frame = document.getElementById('resume-frame');
        const errorEl = document.getElementById('resume-error');
        let loaded = false;

        frame.addEventListener('load', function () {
          loaded = true;
          errorEl.classList.add('hidden');
        });

        setTimeout(function () {
          if (!loaded) {
            errorEl.classList.remove('hidden');
          }
        }, 8000);
      });
    </script>
    <style>
      .resume-error {
        text-align: center;
        padding: 2rem;
        color: #991b1b;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 4px;
        margin-top: 1rem;
      }

      .resume-error.hidden {
        display: none;
      }
    </style>
  </body>
</html>
